[package]
name = "jolt-desktop"
version = "0.0.0"
description = "Jolt desktop"
authors = ["you"]
edition = "2021"
publish = false

[lib]
name = "jolt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.11", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[package]
name = "jot-desktop"
version = "0.0.0"
description = "Jot desktop"
authors = ["you"]
edition = "2021"
publish = false

[lib]
name = "jot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

name: Mobile

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    name: iOS simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install --frozen-lockfile
      - name: Prebuild and compile iOS
        working-directory: apps/mobile
        run: bunx expo run:ios --configuration Debug --no-bundler
        env:
          CI: "1"

  android:
    name: Android emulator compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: bun install --frozen-lockfile
      - name: Assemble debug APK
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --non-interactive && cd android && ./gradlew assembleDebug
        env:
          CI: "1"

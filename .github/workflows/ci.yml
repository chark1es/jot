name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared:
    name: Shared checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Canonical JSON in Rust
        run: cargo test --manifest-path crates/canonical-json/Cargo.toml
      - name: Crypto core crate
        run: cargo test --manifest-path crates/crypto-core/Cargo.toml
